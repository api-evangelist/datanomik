aid: datanomik
name: Datanomik
description: >-
  Datanomik is a Brazilian open finance and treasury-management platform that gives
  mid-to-large enterprises real-time, consolidated visibility across their bank
  accounts, balances, investments and payments through a single API. Authorized by
  Banco Central do Brasil as a Payment Transaction Initiator (ITP) and a participant
  in Brazil's Open Finance ecosystem, Datanomik connects to 30+ Brazilian financial
  institutions (Banco do Brasil, Itau, Bradesco, Caixa, BTG, Nubank, Safra, Mercado
  Pago and others) to deliver bank connectivity, cash and liquidity management,
  investment-portfolio tracking, cash-flow forecasting, cash pooling and transfers,
  automated bank statements and financial reporting. The company exposes two REST
  APIs - an OpenBanking data API and a Treasury/Remuneration API - secured with HTTP
  Basic API keys, documented on a ReadMe developer portal with a public Postman
  workspace and a dedicated sandbox. Backed by a16z, its clients include iFood,
  Magalu, Flamengo and Unimed.
